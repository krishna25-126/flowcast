# FlowCast central configuration. All paths are relative to the repo root.
project:
  name: FlowCast
  seed: 42

paths:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  models_dir: models
  reports_dir: reports
  figures_dir: reports/figures

raw_files:
  traffic: traffic_sensor_log.csv
  weather: weather_observations.csv
  calendar: calendar_events.csv

data:
  window_minutes: 30
  n_segments: 25
  date_start: "2025-01-01"
  date_end: "2025-05-31"

# Validation rules used by src/ingest.py (PRD section 9 stage 1, data dictionary section 5)
validation:
  road_id_pattern: '^NL-\d{3}$'
  weather_stations: [WS-NORTH, WS-CENTRAL, WS-SOUTH]
  vehicle_share_tolerance: 0.02      # vehicle_type_dist shares must sum to 1 +/- this
  # Required fields: a violation REMOVES the row (logged to quarantine)
  traffic_required:
    latitude: {min: -90, max: 90}
    longitude: {min: -180, max: 180}
    signal_timing: {min: 0, max: 600}
    road_capacity: {min: 1, max: 20000}
    accident_count: {min: 0, max: 100}
  # Optional measurements: a violation NULLS the value, keeps the row (logged to quarantine)
  traffic:
    traffic_volume: {min: 0, max: 10000}
    vehicle_count: {min: 0, max: 10000}
    avg_speed: {min: 0, max: 200}
    occupancy: {min: 0, max: 100}
    travel_time: {min: 0, max: 240}
  weather:
    temperature: {min: -30, max: 55}
    rainfall: {min: 0, max: 300}
    visibility: {min: 0, max: 20000}

# Cleaning policy used by src/clean.py (PRD section 9 stages 2-5)
cleaning:
  max_interp_gap_windows: 4          # gaps up to 2 h are linearly interpolated; longer -> train-period medians
  max_interp_gap_hours_weather: 3
  outlier:
    robust_z_flag: 5.0               # |robust z| above this is flagged (kept: usually real events/holidays)
    robust_z_null: 8.0               # |robust z| above this on an ORDINARY day is a sensor fault -> re-imputed
    iqr_k: 3.0                       # Tukey fence multiplier, reported alongside the z-score
  weather_label_map:                 # controlled vocabulary: Clear / Cloudy / Rain / Fog
    clear: Clear
    cloudy: Cloudy
    overcast: Cloudy
    rain: Rain
    rainy: Rain
    fog: Fog
    foggy: Fog

# Congestion banding on V/C = volume / (road_capacity / 2)
congestion_bands:
  free_flow_max: 0.50
  moderate_max: 0.80
  heavy_max: 1.00

# Time-based split (fractions of the timeline, never random)
split:
  train_frac: 0.70
  val_frac: 0.15
  test_frac: 0.15

# Success criteria from PRD section 3.3
targets:
  volume_mape_max: 0.12
  congestion_macro_f1_min: 0.80
  accident_roc_auc_min: 0.75
